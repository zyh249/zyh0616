<svg xmlns='http://www.w3.org/2000/svg' width='960' height='520' viewBox='0 0 960 520'>
<defs>
<marker id='arrow' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#6B7280'/></marker>
<filter id='shadow' x='-10%' y='-10%' width='120%' height='120%'><feDropShadow dx='0' dy='2' stdDeviation='2' flood-opacity='0.18'/></filter>
</defs>
<rect width='100%' height='100%' fill='white'/>
<text x='480.0' y='34' font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='22' fill='#222' font-weight='700' text-anchor='middle'>Padding、Stride 与输出尺寸</text>
<rect x='50' y='90' width='190' height='110' rx='12' fill='#EAF3FF' stroke='#2F80ED' stroke-width='1.5' filter='url(#shadow)'/>
<rect x='50' y='90' width='8' height='110' rx='8' fill='#2F80ED' stroke='#2F80ED' stroke-width='0'/>
<text x='145.0' y='118' font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='16' fill='#222' font-weight='700' text-anchor='middle'>Kernel Size K</text>
<text x='66' y='145' font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#4B5563' font-weight='400' text-anchor='start'>
<tspan x='66' dy='0'>卷积核大小。</tspan>
<tspan x='66' dy='15.0'>例如 3×3、5×5。</tspan>
</text>
<rect x='280' y='90' width='190' height='110' rx='12' fill='#EAF7F0' stroke='#219653' stroke-width='1.5' filter='url(#shadow)'/>
<rect x='280' y='90' width='8' height='110' rx='8' fill='#219653' stroke='#219653' stroke-width='0'/>
<text x='375.0' y='118' font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='16' fill='#222' font-weight='700' text-anchor='middle'>Padding P</text>
<text x='296' y='145' font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#4B5563' font-weight='400' text-anchor='start'>
<tspan x='296' dy='0'>在图像边缘补 0，</tspan>
<tspan x='296' dy='15.0'>减少边缘信息丢失。</tspan>
</text>
<rect x='510' y='90' width='190' height='110' rx='12' fill='#FFF4E8' stroke='#F2994A' stroke-width='1.5' filter='url(#shadow)'/>
<rect x='510' y='90' width='8' height='110' rx='8' fill='#F2994A' stroke='#F2994A' stroke-width='0'/>
<text x='605.0' y='118' font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='16' fill='#222' font-weight='700' text-anchor='middle'>Stride S</text>
<text x='526' y='145' font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#4B5563' font-weight='400' text-anchor='start'>
<tspan x='526' dy='0'>每次滑动几格。</tspan>
<tspan x='526' dy='15.0'>步长越大，输出越小。</tspan>
</text>
<rect x='740' y='90' width='170' height='110' rx='12' fill='#F1EEFF' stroke='#7B61FF' stroke-width='1.5' filter='url(#shadow)'/>
<rect x='740' y='90' width='8' height='110' rx='8' fill='#7B61FF' stroke='#7B61FF' stroke-width='0'/>
<text x='825.0' y='118' font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='16' fill='#222' font-weight='700' text-anchor='middle'>Input H/W</text>
<text x='756' y='145' font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#4B5563' font-weight='400' text-anchor='start'>
<tspan x='756' dy='0'>输入图像或特征图</tspan>
<tspan x='756' dy='15.0'>的高、宽。</tspan>
</text>
<rect x='70' y='250' width='820' height='130' rx='16' fill='#F9FAFB' stroke='#CBD5E1' stroke-width='1.5' filter='url(#shadow)'/>
<text x='480' y='305' font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='28' fill='#111827' font-weight='700' text-anchor='middle'>H_out = floor((H_in + 2P - K) / S) + 1</text>
<text x='480' y='350' font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='16' fill='#4B5563' font-weight='400' text-anchor='middle'>W_out 同理；如果高宽使用不同参数，就分别计算。</text>
<path d='M145 205 C145 230 230 240 330 262' stroke='#2F80ED' fill='none' stroke-width='2' marker-end='url(#arrow)'/>
<path d='M375 205 C375 230 405 240 420 262' stroke='#219653' fill='none' stroke-width='2' marker-end='url(#arrow)'/>
<path d='M605 205 C605 230 560 240 530 262' stroke='#F2994A' fill='none' stroke-width='2' marker-end='url(#arrow)'/>
<path d='M825 205 C825 230 680 240 610 262' stroke='#7B61FF' fill='none' stroke-width='2' marker-end='url(#arrow)'/>
<text x='70' y='450' font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='16' fill='#222222' font-weight='400' text-anchor='start'>例：输入 32×32，K=3，P=1，S=1，则输出仍是 32×32；这就是常见的 same convolution 思路。</text>
</svg>