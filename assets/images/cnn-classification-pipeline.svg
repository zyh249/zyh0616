<text x='70' y='465' font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='16' fill='#222222' font-weight='400' text-anchor='start'>核心理解：CNN 前半部分像“特征提取器”，后半部分像“分类器”。训练时二者一起通过反向传播更新。</text>
